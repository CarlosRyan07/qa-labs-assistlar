name: qa-labs-assistlar

services:
  postgres:
    image: postgres:17.10-alpine3.24
    environment:
      POSTGRES_DB: assistlar
      POSTGRES_USER: assistlar
      POSTGRES_PASSWORD: assistlar
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistlar -d assistlar"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - assistlar-postgres:/var/lib/postgresql/data

  app:
    build:
      context: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/assistlar
      DB_USERNAME: assistlar
      DB_PASSWORD: assistlar
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  assistlar-postgres:
