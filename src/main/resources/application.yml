spring:
  application:
    name: assistlar
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/assistlar}
    username: ${DB_USERNAME:assistlar}
    password: ${DB_PASSWORD:assistlar}
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: UTC
    deserialization:
      fail-on-unknown-properties: true
  web:
    error:
      include-message: never
      include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
