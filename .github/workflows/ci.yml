name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-quality:
    name: Build, testes e qualidade
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v6

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Confirmar o ambiente
        run: |
          java -version
          docker version
          chmod +x mvnw
          ./mvnw --version

      - name: Executar testes e quality gate
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Armazenar relatorios de qualidade
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
            target/site/jacoco/**
          retention-days: 14
          if-no-files-found: warn
