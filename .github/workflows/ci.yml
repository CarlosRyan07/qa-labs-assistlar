name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-quality:
    name: Build, testes e qualidade
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v6

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Confirmar o ambiente
        run: |
          java -version
          docker version
          chmod +x mvnw
          ./mvnw --version

      - name: Executar testes e quality gate
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Armazenar relatorios de qualidade
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
            target/site/jacoco/**
          retention-days: 14
          if-no-files-found: warn

  frontend-quality:
    name: Qualidade frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v6

      - name: Configurar Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Confirmar o ambiente frontend
        working-directory: frontend
        run: |
          node --version
          npm --version

      - name: Instalar dependencias frontend
        working-directory: frontend
        run: npm ci

      - name: Executar lint, tipos, testes e build
        working-directory: frontend
        run: |
          npm run lint
          npm run typecheck
          npm run test:coverage
          npm run test:component
          npm run build

      - name: Armazenar relatorio de cobertura frontend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/**
          retention-days: 14
          if-no-files-found: warn

  frontend-e2e:
    name: E2E frontend (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v6

      - name: Configurar Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias frontend
        working-directory: frontend
        run: npm ci

      - name: Instalar Chromium do Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Executar jornada E2E
        working-directory: frontend
        run: npm run test:e2e

      - name: Armazenar evidencias E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-artifacts
          path: |
            frontend/playwright-report/**
            frontend/test-results/**
          retention-days: 14
          if-no-files-found: warn
